<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TAB SỰ KIỆN | Trang chủ</title>
  <style>
    /* ===== FONT GFF ===== */
    @font-face {
      font-family: "GFF-Latin-Bold";
      src: url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),
           url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* ===== RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    html, body { width: 100%; min-height: 100%; }

    body {
      --pt: max(clamp(6px, 1.5vmin, 24px), env(safe-area-inset-top));
      --pb: max(clamp(6px, 1.5vmin, 24px), env(safe-area-inset-bottom));
      --pl: max(clamp(6px, 1.5vmin, 24px), env(safe-area-inset-left));
      --pr: max(clamp(6px, 1.5vmin, 24px), env(safe-area-inset-right));

      font-family: "GFF-Latin-Bold", system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background-color: #0a0f1e;
      color: #fff;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      padding: var(--pt) var(--pr) var(--pb) var(--pl);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(10, 20, 40, 0.45) 0%, rgba(0, 0, 0, 0.75) 100%),
        url('https://cdn.wildflamestudio.com/common/web_event/official2.ff.garena.all/img/20228/b2b0012af7e3bfcdc90cd8744065e8ab.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
      pointer-events: none;
    }

    /* ===== KHUNG CHÍNH ===== */
    .container {
      margin: auto;

      width: min(
        100%,
        calc((100dvh - var(--pt) - var(--pb)) * 16 / 9),
        1600px
      );
      aspect-ratio: 16 / 9;

      background: rgba(10, 15, 30, 0.55);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      backdrop-filter: blur(16px) saturate(180%);
      border-radius: clamp(16px, 2.5vmin, 48px);
      padding: clamp(14px, 2.5vmin, 40px) clamp(16px, 3vmin, 60px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        0 30px 50px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 215, 0, 0.15) inset,
        0 0 40px rgba(255, 215, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: clamp(6px, 1.2vmin, 16px);
      animation: fadeUp 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
      overflow: hidden;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ============================================================
       SIZING THEO THIẾT BỊ
       ============================================================ */
    @media (min-aspect-ratio: 1/1) and (max-aspect-ratio: 16/10) {
      .container {
        width: min(
          100%,
          calc((100dvh - var(--pt) - var(--pb)) * 4 / 3),
          1400px
        );
        aspect-ratio: 4 / 3;
      }
    }

    @media (max-height: 560px) and (orientation: landscape) {
      .container {
        aspect-ratio: auto;
        width: min(100%, 1600px);
        height: calc(100dvh - var(--pt) - var(--pb));
        max-height: none;
      }
    }

    @media (max-aspect-ratio: 1/1) {
      .container {
        aspect-ratio: auto;
        width: min(100%, 720px);
        height: auto;
        max-height: none;
      }
    }

    @media (min-width: 700px) and (max-aspect-ratio: 1/1) {
      .container {
        width: min(100%, 960px);
      }
    }

    @media (min-width: 2000px) and (min-aspect-ratio: 16/10) {
      .container {
        max-width: 1800px;
      }
    }

    /* ===== HEADER ===== */
    .header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(4px, 0.8vmin, 10px);
      flex-shrink: 0;
    }

    /* ============================================================
       NÚT SỰ KIỆN - LIQUID GLASS (VÁT GÓC TRONG SUỐT)
       ============================================================ */
    .event-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 1.2vmin, 14px);
      width: 100%;
      flex-wrap: wrap;
      margin-bottom: clamp(2px, 0.6vmin, 8px);
    }

    .event-btn {
      --cut: 14px;            /* Độ lớn góc vát */
      --border-w: 1.5px;      /* Độ dày viền kính */

      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;

      font-family: "GFF-Latin-Bold", sans-serif;
      font-size: clamp(0.72rem, 1.85vmin, 1.2rem);
      letter-spacing: clamp(1px, 0.4vmin, 2px);
      text-transform: uppercase;
      color: #fff;
      text-shadow:
        0 1px 3px rgba(0, 0, 0, 0.7),
        0 0 12px rgba(255, 255, 255, 0.2);

      padding: clamp(10px, 1.6vmin, 18px) clamp(22px, 3.2vmin, 46px);
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      border: none;
      outline: none;

      /* Lớp ngoài cùng: viền kính phát sáng */
      background: linear-gradient(135deg,
        rgba(255, 255, 255, 0.75) 0%,
        rgba(255, 255, 255, 0.25) 25%,
        rgba(255, 255, 255, 0.15) 50%,
        rgba(255, 255, 255, 0.25) 75%,
        rgba(255, 255, 255, 0.7) 100%
      );

      clip-path: polygon(
        var(--cut) 0,
        100% 0,
        100% calc(100% - var(--cut)),
        calc(100% - var(--cut)) 100%,
        0 100%,
        0 var(--cut)
      );

      isolation: isolate;

      transition:
        transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1),
        filter 0.35s ease,
        color 0.35s ease,
        text-shadow 0.35s ease,
        background 0.35s ease;

      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
    }

    /* ===== THÂN KÍNH (LỚP TRONG) ===== */
    .event-btn::before {
      content: "";
      position: absolute;
      inset: var(--border-w);
      z-index: 1;

      background:
        /* Vệt sáng phía trên (highlight) */
        radial-gradient(ellipse 130% 70% at 50% -25%,
          rgba(255, 255, 255, 0.5) 0%,
          rgba(255, 255, 255, 0.08) 45%,
          transparent 70%),
        /* Vệt phản chiếu phía dưới */
        radial-gradient(ellipse 100% 60% at 50% 130%,
          rgba(255, 255, 255, 0.2) 0%,
          transparent 60%),
        /* Nền kính chính */
        linear-gradient(135deg,
          rgba(255, 255, 255, 0.12) 0%,
          rgba(255, 255, 255, 0.02) 50%,
          rgba(255, 255, 255, 0.08) 100%
        );

      -webkit-backdrop-filter: blur(14px) saturate(180%) brightness(1.05);
      backdrop-filter: blur(14px) saturate(180%) brightness(1.05);

      clip-path: polygon(
        calc(var(--cut) - var(--border-w) * 2) 0,
        100% 0,
        100% calc(100% - var(--cut) + var(--border-w) * 2),
        calc(100% - var(--cut) + var(--border-w) * 2) 100%,
        0 100%,
        0 calc(var(--cut) - var(--border-w) * 2)
      );
    }

    /* ===== VỆT SÁNG LƯỚT QUA (SHEEN) ===== */
    .event-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;

      background: linear-gradient(105deg,
        transparent 30%,
        rgba(255, 255, 255, 0.3) 48%,
        rgba(255, 255, 255, 0.5) 50%,
        rgba(255, 255, 255, 0.3) 52%,
        transparent 70%
      );

      transform: translateX(-120%);
      transition: transform 0.9s cubic-bezier(0.3, 0.8, 0.3, 1);

      clip-path: polygon(
        var(--cut) 0,
        100% 0,
        100% calc(100% - var(--cut)),
        calc(100% - var(--cut)) 100%,
        0 100%,
        0 var(--cut)
      );
    }

    .event-btn:hover::after {
      transform: translateX(120%);
    }

    /* Text trên cùng */
    .event-btn span {
      position: relative;
      z-index: 3;
    }

    /* ---------- HOVER ---------- */
    .event-btn:hover {
      transform: translateY(-2px);
      filter:
        drop-shadow(0 6px 20px rgba(0, 0, 0, 0.5))
        drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
      text-shadow:
        0 1px 3px rgba(0, 0, 0, 0.7),
        0 0 16px rgba(255, 255, 255, 0.45);
    }

    .event-btn:hover::before {
      background:
        radial-gradient(ellipse 130% 70% at 50% -25%,
          rgba(255, 255, 255, 0.65) 0%,
          rgba(255, 255, 255, 0.15) 45%,
          transparent 70%),
        radial-gradient(ellipse 100% 60% at 50% 130%,
          rgba(255, 255, 255, 0.3) 0%,
          transparent 60%),
        linear-gradient(135deg,
          rgba(255, 255, 255, 0.2) 0%,
          rgba(255, 255, 255, 0.04) 50%,
          rgba(255, 255, 255, 0.15) 100%
        );
    }

    /* ---------- ACTIVE (ĐANG CHỌN - KÍNH VÀNG) ---------- */
    .event-btn.active {
      background: linear-gradient(135deg,
        rgba(255, 235, 160, 0.9) 0%,
        rgba(255, 200, 60, 0.45) 25%,
        rgba(255, 200, 60, 0.3) 50%,
        rgba(255, 200, 60, 0.45) 75%,
        rgba(255, 235, 160, 0.85) 100%
      );

      color: #fff8e0;
      text-shadow:
        0 1px 4px rgba(120, 60, 0, 0.7),
        0 0 16px rgba(255, 215, 0, 0.7);

      filter:
        drop-shadow(0 4px 16px rgba(255, 180, 20, 0.5))
        drop-shadow(0 0 6px rgba(255, 235, 150, 0.4));
    }

    .event-btn.active::before {
      background:
        radial-gradient(ellipse 130% 70% at 50% -25%,
          rgba(255, 250, 210, 0.7) 0%,
          rgba(255, 220, 100, 0.15) 45%,
          transparent 70%),
        radial-gradient(ellipse 100% 60% at 50% 130%,
          rgba(255, 220, 100, 0.35) 0%,
          transparent 60%),
        linear-gradient(135deg,
          rgba(255, 220, 100, 0.35) 0%,
          rgba(255, 200, 60, 0.15) 50%,
          rgba(255, 220, 100, 0.3) 100%
        );

      -webkit-backdrop-filter: blur(14px) saturate(200%) brightness(1.15);
      backdrop-filter: blur(14px) saturate(200%) brightness(1.15);
    }

    /* ---------- PRESSED ---------- */
    .event-btn:active {
      transform: translateY(0) scale(0.97);
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 480px) {
      .event-btn {
        --cut: 10px;
        --border-w: 1.25px;
        padding: 8px 16px;
        font-size: clamp(0.62rem, 2.6vmin, 0.85rem);
      }
    }

    /* ===== TOP LABEL ===== */
    .top-label {
      font-family: "GFF-Latin-Bold", sans-serif;
      font-size: clamp(0.9rem, 3.4vmin, 2.6rem);
      letter-spacing: clamp(3px, 1.6vmin, 14px);
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #ffe28a 40%, #ffb347 80%, #ffd966 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 14px rgba(255, 180, 0, 0.45));
      white-space: nowrap;
      line-height: 1.1;
    }

    .logo-img {
      height: clamp(48px, 9vmin, 120px);
      width: auto;
      max-width: 60%;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.7)) brightness(1.05);
      transition: transform 0.3s ease;
    }
    .logo-img:hover { transform: scale(1.03); }

    /* ===== TAB SECTION ===== */
    .tab-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(4px, 0.8vmin, 12px);
      width: 100%;
      flex-shrink: 0;
    }

    .tab-title {
      font-family: "GFF-Latin-Bold", sans-serif;
      font-size: clamp(0.95rem, 3.4vmin, 2.8rem);
      letter-spacing: clamp(2px, 1.2vmin, 8px);
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #ffe28a 40%, #ffb347 80%, #ffd966 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 14px rgba(255, 180, 0, 0.35));
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
    }

    .tab-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .tab-image {
      max-width: 100%;
      height: auto;
      max-height: clamp(60px, 12vmin, 160px);
      object-fit: contain;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.5));
      transition: transform 0.25s ease, filter 0.25s ease;
    }
    .tab-image:hover {
      transform: translateY(-3px) scale(1.02);
      filter: drop-shadow(0 14px 26px rgba(255, 215, 0, 0.35));
    }

    /* ===== CONTENT ===== */
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(6px, 1.6vmin, 24px);
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .content h2 {
      font-family: "GFF-Latin-Bold", sans-serif;
      font-size: clamp(0.95rem, 3vmin, 2.6rem);
      letter-spacing: clamp(3px, 1.6vmin, 14px);
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #ffe28a 40%, #ffb347 80%, #ffd966 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 14px rgba(255, 180, 0, 0.45));
      line-height: 1.15;
      max-width: 92%;
      flex-shrink: 0;
    }

    .text-image-box {
      width: 100%;
      max-width: min(92%, 980px);
      flex: 1 1 auto;
      min-height: 100px;
      max-height: 100%;
      border-radius: clamp(12px, 1.8vmin, 28px);
      background-image: url('https://azerst-image-vn.vercel.app/images/orGmr7jOS.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(12px, 3vmin, 44px) clamp(16px, 3vmin, 50px);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 215, 0, 0.25);
      box-shadow:
        0 20px 40px -10px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.08) inset;
      isolation: isolate;
      margin: 0 auto;
      transition: background-image 0.35s ease;
    }

    .text-image-box::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(5, 10, 25, 0.55) 0%, rgba(0, 0, 0, 0.7) 100%);
      z-index: -1;
    }

    /* ===== FOOTER ===== */
    .footer-note {
      font-size: clamp(0.5rem, 1vmin, 0.95rem);
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: clamp(1px, 0.25vmin, 3px);
      text-transform: uppercase;
      font-family: "GFF-Latin-Bold", sans-serif;
      flex-shrink: 0;
      text-align: center;
      white-space: nowrap;
    }

    /* ===== TINH CHỈNH NHỎ CHO PORTRAIT ===== */
    @media (max-aspect-ratio: 1/1) {
      .content {
        flex: 0 1 auto;
        gap: clamp(10px, 2vmin, 20px);
      }
      .text-image-box {
        flex: 0 1 auto;
        aspect-ratio: 16 / 9;
        max-height: none;
        min-height: 0;
        width: 100%;
      }
      .footer-note { white-space: normal; }
    }

    @media (max-width: 480px) and (max-aspect-ratio: 1/1) {
      .container { border-radius: 16px; padding: 16px; gap: 12px; }
      .top-label {
        font-size: clamp(0.85rem, 3.8vmin, 1.3rem);
        letter-spacing: clamp(3px, 1.5vmin, 6px);
      }
      .logo-img { height: clamp(40px, 9vmin, 70px); max-width: 70%; }
      .tab-title {
        font-size: clamp(0.9rem, 4vmin, 1.4rem);
        letter-spacing: clamp(2px, 1vmin, 4px);
        white-space: normal;
      }
      .tab-image { max-height: clamp(48px, 11vmin, 90px); }
      .content h2 {
        font-size: clamp(0.85rem, 3.6vmin, 1.3rem);
        letter-spacing: clamp(2px, 1vmin, 5px);
      }
      .text-image-box { aspect-ratio: 4 / 3; }
      .footer-note { font-size: 0.55rem; letter-spacing: 1px; }
    }

    /* ===== prefers-reduced-motion ===== */
    @media (prefers-reduced-motion: reduce) {
      .container { animation: none; }
      .tab-image, .logo-img, .event-btn { transition: none; }
      .tab-image:hover, .logo-img:hover, .event-btn:hover { transform: none; }
      .event-btn::after { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <nav class="event-nav" aria-label="Danh sách sự kiện">
        <button type="button" class="event-btn active">
          <span>Sự kiện 1</span>
        </button>
        <button type="button" class="event-btn">
          <span>Sự kiện 2</span>
        </button>
        <button type="button" class="event-btn">
          <span>Sự kiện 3</span>
        </button>
      </nav>

      <div class="top-label">TITLE SỰ KIỆN</div>
      <img src="https://azerst-image-vn.vercel.app/images/8F9d2wz2w.png"
           alt="Logo GFF" class="logo-img" loading="lazy">
    </header>

    <div class="tab-section">
      <div class="tab-title">TAB SỰ KIỆN</div>
      <div class="tab-wrapper">
        <img src="https://azerst-image-vn.vercel.app/images/wRZwa1Bqv.png"
             alt="Tab điều hướng" class="tab-image" loading="lazy">
      </div>
    </div>

    <main class="content">
      <h2>BACKGROUND SỰ KIỆN</h2>
      <div class="text-image-box"></div>
    </main>

    <div class="footer-note">© Azerst 2026 – All rights reserved</div>
  </div>

  <script>
    // Bộ ảnh theo từng sự kiện
    const EVENT_IMAGES = {
      1: {
        logo: 'https://azerst-image-vn.vercel.app/images/8F9d2wz2w.png',
        tab:  'https://azerst-image-vn.vercel.app/images/wRZwa1Bqv.png',
        bg:   'https://azerst-image-vn.vercel.app/images/orGmr7jOS.png'
      },
      2: {
        logo: 'https://azerst-image-vn.vercel.app/images/m4jwa7iMn.png',
        tab:  'https://azerst-image-vn.vercel.app/images/Xl6yeAKFU.png',
        bg:   'https://azerst-image-vn.vercel.app/images/QOoBqwG3R.png'
      },
      3: {
        logo: 'https://azerst-image-vn.vercel.app/images/mw5xbjnMj.png',
        tab:  'https://azerst-image-vn.vercel.app/images/GsqjGtxDt.png',
        bg:   'https://azerst-image-vn.vercel.app/images/rGM5HmhEG.png'
      }
    };

    const logoEl = document.querySelector('.logo-img');
    const tabEl  = document.querySelector('.tab-image');
    const bgEl   = document.querySelector('.text-image-box');

    // Xử lý chuyển tab sự kiện + đổi ảnh tương ứng
    document.querySelectorAll('.event-btn').forEach((btn, i) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.event-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const set = EVENT_IMAGES[i + 1];
        if (!set) return;
        logoEl.src = set.logo;
        tabEl.src  = set.tab;
        bgEl.style.backgroundImage = `url('${set.bg}')`;
      });
    });
  </script>
</body>
</html>
