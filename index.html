<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAB SỰ KIỆN | Trang chủ</title>
  <style>
    /* ===== FONT GFF ===== */
    @font-face {
      font-family: "GFF-Latin-Bold";
      src: url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),
           url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: "GFF-Latin-Bold", system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background-image: url('https://cdn.wildflamestudio.com/common/web_event/official2.ff.garena.all/img/20228/b2b0012af7e3bfcdc90cd8744065e8ab.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2vh 2vw;
      color: #ffffff;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(10, 20, 40, 0.45) 0%, rgba(0, 0, 0, 0.75) 100%);
      z-index: -1;
      pointer-events: none;
    }

    /* ===== KHUNG CHÍNH – TỶ LỆ 16:9 ===== */
    .container {
      width: min(96vw, calc(96vh * 16 / 9));
      aspect-ratio: 16 / 9;
      max-width: 1600px;
      background: rgba(10, 15, 30, 0.55);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: clamp(20px, 2.5vw, 48px);
      padding: clamp(16px, 3vh, 48px) clamp(20px, 3.5vw, 60px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 
        0 30px 50px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 215, 0, 0.15) inset,
        0 0 40px rgba(255, 215, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      animation: fadeUp 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
      overflow: hidden;
      gap: clamp(6px, 1.2vh, 16px);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== HEADER: LABEL + LOGO + TIÊU ĐỀ ===== */
    .header {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: clamp(4px, 0.8vh, 10px);
      flex-shrink: 0;
    }

    .top-label {
      font-family: "GFF-Latin-Bold", sans-serif;
      font-size: clamp(1.4rem, 3vw, 2.6rem);
      letter-spacing: clamp(6px, 1.6vw, 14px);
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #ffe28a 40%, #ffb347 80%, #ffd966 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(255, 200, 50, 0.6);
      filter: drop-shadow(0 4px 14px rgba(255, 180, 0, 0.45));
      white-space: nowrap;
      line-height: 1.1;
    }

    /* LOGO + TIÊU ĐỀ – căn giữa cân đối */
    .logo-title {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 2.2vw, 36px);
      flex-wrap: nowrap;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* ẢNH TITLE (LOGO) – TĂNG KÍCH THƯỚC */
    .logo-title img {
      height: clamp(60px, 10vh, 140px);
      width: auto;
      max-width: 45%;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.7)) brightness(1.05);
      transition: transform 0.3s ease;
    }

    .logo-title img:hover {
      transform: scale(1.03);
    }

    .title-text {
      font-family: "GFF-Latin-Bold", sans-serif;
      font-size: clamp(1.4rem, 3.2vw, 2.8rem);
      font-weight: 700;
      letter-spacing: clamp(1px, 0.3vw, 3px);
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #ffe28a 40%, #ffb347 80%, #ffd966 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 4px 18px rgba(255, 200, 50, 0.4);
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 0 1 auto;
      min-width: 0;
    }

    /* ===== TAB – HÌNH ẢNH TAB (TO + NỀN TRONG SUỐT) ===== */
    .tab-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      flex-shrink: 0;
      padding: 0;
    }

    .tab-image {
      max-width: 100%;
      width: auto;
      height: auto;
      max-height: clamp(90px, 15vh, 190px);
      object-fit: contain;
      background: transparent;
      border-radius: 0;
      padding: 0;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.5));
      transition: all 0.25s ease;
    }

    .tab-image:hover {
      transform: translateY(-3px) scale(1.02);
      filter: drop-shadow(0 14px 26px rgba(255, 215, 0, 0.35));
    }

    /* ===== NỘI DUNG CHÍNH ===== */
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: clamp(8px, 1.6vh, 24px);
      font-family: "GFF-Latin-Bold", sans-serif;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .content h2 {
      font-family: "GFF-Latin-Bold", sans-serif;
      font-size: clamp(1.4rem, 3vw, 2.6rem);
      letter-spacing: clamp(6px, 1.6vw, 14px);
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #ffe28a 40%, #ffb347 80%, #ffd966 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(255, 200, 50, 0.6);
      filter: drop-shadow(0 4px 14px rgba(255, 180, 0, 0.45));
      line-height: 1.15;
      max-width: 92%;
    }

    /* ===== KHUNG ẢNH NỀN CHỨA NỘI DUNG ===== */
    .text-image-box {
      width: 100%;
      max-width: min(92%, 980px);
      aspect-ratio: 16 / 7;
      border-radius: clamp(14px, 1.8vw, 28px);
      background-image: url('https://azerst-image-vn.vercel.app/images/orGmr7jOS.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(16px, 3vh, 44px) clamp(20px, 3vw, 50px);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 215, 0, 0.25);
      box-shadow: 
        0 20px 40px -10px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.08) inset;
      isolation: isolate;
      margin: 0 auto;
    }

    .text-image-box::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(5, 10, 25, 0.55) 0%, rgba(0, 0, 0, 0.7) 100%);
      z-index: -1;
    }

    /* ===== FOOTER NHỎ ===== */
    .footer-note {
      font-size: clamp(0.6rem, 1vw, 0.95rem);
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: clamp(1px, 0.25vw, 3px);
      text-transform: uppercase;
      font-family: "GFF-Latin-Bold", sans-serif;
      flex-shrink: 0;
      text-align: center;
      white-space: nowrap;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-aspect-ratio: 1/1) {
      .container {
        aspect-ratio: auto;
        height: auto;
        min-height: 90vh;
        padding: 24px 20px;
        gap: 16px;
      }
      .logo-title {
        flex-wrap: wrap;
        max-width: 100%;
      }
      .title-text {
        max-width: 100%;
      }
      .text-image-box {
        aspect-ratio: auto;
        min-height: 180px;
      }
    }

    @media (max-width: 480px) {
      .logo-title {
        flex-direction: column;
        gap: 6px;
      }
      .logo-title img {
        max-width: 65%;
      }
      .title-text {
        max-width: 100%;
        white-space: normal;
        text-align: center;
      }
      .top-label {
        letter-spacing: clamp(3px, 1vw, 6px);
      }
      .content h2 {
        letter-spacing: clamp(3px, 1vw, 6px);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="top-label">TITLE SỰ KIỆN</div>

      <div class="logo-title">
        <img src="https://azerst-image-vn.vercel.app/images/8F9d2wz2w.png" alt="Logo GFF">
        <span class="title-text">TAB SỰ KIỆN</span>
      </div>
    </header>

    <div class="tab-wrapper">
      <img 
        src="https://azerst-image-vn.vercel.app/images/wRZwa1Bqv.png" 
        alt="Tab điều hướng" 
        class="tab-image"
        loading="lazy"
      >
    </div>

    <main class="content">
      <h2>BACKGROUND SỰ KIỆN</h2>
      <div class="text-image-box"></div>
    </main>

    <div class="footer-note">GFF © 2025 – All rights reserved</div>
  </div>
</body>
</html>
